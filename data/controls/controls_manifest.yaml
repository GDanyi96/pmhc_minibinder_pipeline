# Controls panel — runs every cycle. Halts pipeline if P1 fails.
# Sequences marked TBD are populated by stage 0 (Baker SI + Jenkins paper).

controls:
  - id: P1
    label: Baker WT1 binder vs WT1/A*02:01
    binder_sequence: TBD            # BAKER_LAB_2025 SI / Zenodo 77forest/pmhcibinderdesign
    target_pdb: 3HPJ
    target_peptide: RMFPNAPYL
    expected_ipae_max: 7.0
    expected_rank_top_pct: 10
    source: BAKER_LAB_2025

  - id: P2
    label: Jenkins NY1-B04 vs SLLMWITQC/A*02:01
    binder_sequence: TBD            # HADRUP_JENKINS_2025 Fig 1B
    target_pdb: 2BNR
    target_peptide: SLLMWITQC
    expected_ipae_approx: 6.5
    source: HADRUP_JENKINS_2025

  - id: P3
    label: Baker WT1 binder vs MART-1/A*02:01 (off-target)
    binder_sequence: TBD            # same as P1
    target_pdb: 3HPJ                # MHC scaffold; peptide swapped to MART-1
    target_peptide: ELAGIGILTV
    expected_ipae_min_above_p1: 3.0
    source: cross_panning_analog

  - id: N1
    label: Scrambled Baker WT1 sequence
    binder_sequence: TBD            # generated by scramble of P1 binder
    target_pdb: 3HPJ
    target_peptide: RMFPNAPYL
    expected_ipae_min: 15.0
    source: synthesized_by_script

  - id: N2
    label: Random 65-residue sequence (natural AA freqs)
    binder_sequence: TBD            # generated by script with natural AA frequencies
    target_pdb: 3HPJ
    target_peptide: RMFPNAPYL
    expected_ipae_min: 20.0
    source: synthesized_by_script

halt_rule:
  description: "If P1 falls in the bottom 50% of cycle designs by iPAE, halt and alert."
  metric: ipae
  control: P1
  min_percentile: 50
