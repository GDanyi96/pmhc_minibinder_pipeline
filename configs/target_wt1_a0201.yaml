# Primary target: WT1 RMFPNAPYL / HLA-A*02:01 (PDB 3HPJ)
# Per HADRUP_JENKINS_2025 chain conventions for AF2-multimer.

target_id: wt1_a0201
pdb_id: 3HPJ
peptide_sequence: RMFPNAPYL
mhc_allele: HLA-A*02:01

chains:
  heavy_chain: A   # MHC class I heavy chain
  beta2m: B        # β2-microglobulin
  peptide: C       # epitope
  binder: D        # de novo designed minibinder (added downstream)

# Hotspot residues on the peptide-presenting surface used by RFdiffusion to bias
# the diffusion towards a binding pose. Final list is set in stage 0; placeholder
# values below are derived from the peptide solvent-exposed residues per
# HADRUP_JENKINS_2025 protocol. Confirm against PyMOL inspection in stage 0.
hotspots_peptide: [C1, C4, C6, C8]      # peptide-side hotspots (TBD: confirm)
hotspots_mhc: [A65, A66, A150, A155]    # MHC α1/α2 helix hotspots (TBD: confirm)

# Binder design constraints (stage 1)
# Length range widened for cycle 2: BAKER_LAB_2025 Data S1 reports wt1-5
# (85 aa) and wt1-8 (86 aa) de novo binders, with the broader de novo
# cluster spanning 77-102 aa. 70-110 brackets that distribution with
# +/- a few residues of slack on each side.
binder:
  length_min: 70
  length_max: 110

# Source of cleaned PDB (populated by stage 0)
cleaned_pdb_path: data/targets/3hpj_clean.pdb
