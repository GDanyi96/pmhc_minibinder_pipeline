# Deterministic seeding for cycle-scoped runs.
#
# Formulas are the canonical source; reserved ranges are assertion bounds.
# Both `workflow.scripts.run_rfdiffusion._compute_seed` and
# `workflow.scripts.aggregate_mpnn_outputs._compute_mpnn_seed` /
# `_compute_af2_seed` re-derive seeds from these formulas and assert that
# every emitted seed falls inside its cycle's per-stage reserved interval.
# Reserved ranges cap cycle 2 at 200 RFdiffusion designs (PoC scale;
# A100 ~2.5 h GPU wall-time per HADRUP_JENKINS_2025 timing).

formulas:
  rfdiffusion: "cycle * 1000 + design_index"                          # cycle_02: 2000-2199
  proteinmpnn: "cycle * 1000 + 200 + design_index * 4 + seq_index"    # cycle_02: 2200-2999
  af2_fanin:   "cycle * 1000 + 1000 + fan_in_rank"                    # cycle_02: 3000-3099

reserved:
  # Cycle 1 ran controls + Stage 2 only in production (no RFdiffusion). The
  # ranges below are kept so the snakemake mock end-to-end test, which
  # defaults to --cycle 01, can still exercise the full DAG including the
  # new stage2_designs rule.
  cycle_01_rfdiffusion: [1000, 1999]
  cycle_01_proteinmpnn: [1200, 1999]
  cycle_01_af2_fanin:   [2000, 2099]
  cycle_02_rfdiffusion: [2000, 2199]
  cycle_02_proteinmpnn: [2200, 2999]
  cycle_02_af2_fanin:   [3000, 3099]
  # Cycle 03: partial-diffusion subruns share the rfdiffusion range.
  # Sub-run A (BAKER scaffolds) takes indices 0..149 (3000-3149); sub-run B
  # (design_2079 seed) takes indices 150..179 (3150-3179) via the
  # `seed_offset` keys in rfdiffusion_subrun_{a,b}.yaml.
  cycle_03_rfdiffusion: [3000, 3199]
  cycle_03_proteinmpnn: [3200, 3999]
  cycle_03_af2_fanin:   [4000, 4099]
  # Mock cycle 99: `--cycle 99` smoke tests. Each stage gets its own
  # 100-seed slot so the assertion bounds remain stage-specific.
  cycle_99_rfdiffusion: [99000, 99199]
  cycle_99_proteinmpnn: [99200, 99999]
  cycle_99_af2_fanin:   [100000, 100099]
