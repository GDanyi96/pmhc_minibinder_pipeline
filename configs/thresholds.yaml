# All numerical filter thresholds for the pipeline.
# Anchored to HADRUP_JENKINS_2025 (AF2 cuts) and MARES_IOANNIDIS_2025 (recycles).
# No magic numbers in code — load from here.

af2:
  num_recycles: 6
  multimer_preset: multimer
  # Cycle 1 (loose) vs Final (post partial-diffusion) cuts
  ipae:
    cycle1_max: 12.0
    final_max: 7.0
  iplddt:
    cycle1_min: 70.0
    final_min: 92.0

proteinmpnn:
  temperature: 0.1
  # NLL percentile filter (lower NLL = better)
  nll_top_pct_cycle1: 10
  nll_top_pct_final: 5

crosspan:
  # ΔiPAE = iPAE(off-target) − iPAE(on-target)
  # Larger ΔiPAE = more specific. Designs with min ΔiPAE below this are rejected.
  min_delta_ipae: 3.0
  # Off-target peptides scored (HLA-A*02:01 restricted, validated tumour/viral 9mers)
  panel:
    - { name: MART-1,  sequence: ELAGIGILTV, source: melanoma }
    - { name: gp100,   sequence: IMDQVPFSV,  source: melanoma }
    - { name: NY-ESO-1, sequence: SLLMWITQC, source: testis_cancer }
    - { name: MAGE-A3, sequence: FLWGPRALV,  source: cancer_testis }
    - { name: CMV-pp65, sequence: NLVPMVATV, source: viral }
    - { name: Influenza-M1, sequence: GILGFVFTL, source: viral }

diversity:
  esm_model: esm2_t33_650M_UR50D
  fps_n_select: 96     # designs taken forward per cycle
  embedding_pool: mean # mean | cls

active_learning:
  surrogate: lightgbm   # baseline GP also trained for comparison
  acquisition: ucb
  ucb_kappa: 2.0
  cycle1_train_size: 96 # synthetic labels seeded for cold-start

controls:
  # If P1 (Baker WT1 binder) falls below this percentile of designs, halt.
  p1_min_percentile: 50

# Stage 2 absolute gates — applied by scripts/run_controls.py.
# These bound the controls-only run before any novel designs are scored.
stage2:
  cycle1:
    ipae_max: 12.0       # HADRUP_JENKINS_2025 Fig 1A
    iplddt_min: null
  final:
    ipae_max: 7.0        # HADRUP_JENKINS_2025 Fig 1A
    iplddt_min: 92.0     # HADRUP_JENKINS_2025 Fig 1A
  proteinmpnn:
    temperature: 0.1
    nll_top_fraction: 0.10
  controls:
    # Cycle-1 rule rewrite. The previous "P1 ranks <= 2 of 5" check fired
    # falsely on real data: P2 has more interface (longer published binder),
    # and P3 scores ~ P1 due to the AF2-multimer specificity blind spot
    # (HOUSEHOLDER_GARCIA_2025, MARES_IOANNIDIS_2025). Specificity is
    # Stage 3 cross-pan's job, not Stage 2 iPAE rank.
    p1_ipae_max: 7.0                # P1 must bind cognate
    p2_ipae_tolerance: 2.0          # P2 calibration: 6.5 +/- 2.0 Ang vs Jenkins
    pos_neg_ipae_gap_min: 10.0      # min(N1,N2) iPAE - max(P1,P2,P3) iPAE
    pos_neg_iplddt_gap_min: 30.0    # min(P1,P2,P3) ipLDDT - max(N1,N2) ipLDDT
