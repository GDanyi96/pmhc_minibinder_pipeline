# AF2-multimer config for Stage 2 real-designs fan-in.
# References: HADRUP_JENKINS_2025 Fig 1A intermediate cut (iPAE<12 AND
# ipLDDT>88) and fan-in shape (~5500 backbones -> 22000 sequences ->
# 100-ish at intermediate cut). Halt threshold is calibration-only for
# cycle 2; tighten in cycle 3 once partial diffusion lands.

# Cycle 03 settings (was cycle-02 PoC: num_recycles=3, fan_in_top_n=50,
# halt_cut_ipae_max=12.0). Now that partial diffusion lands real binders we
# promote the funnel to the asymptotic spec: 6 recycles for sharper final
# metrics, top-100 fan-in for a confident halt verdict. Halt gates are
# recalibrated against the cycle-03 truncated controls baseline
# (results/cycle_03/controls_truncated_baseline/metrics_truncated_baseline.json:
# P1 iPAE 3.33, N1 22.0, ~18 A dynamic range), tightened from cycle-02's
# 10.0/88.0. See specs/stage2_proteinmpnn_af2.md.
num_recycles: 6
fan_in_top_n: 100
halt_cut_ipae_max: 6.0
halt_cut_iplddt_min: 92.0
halt_threshold_fraction: 0.10
